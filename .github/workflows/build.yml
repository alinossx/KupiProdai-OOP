name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++ project to EXE
        run: g++ -std=c++17 -O2 -static *.cpp -o KupiProdai.exe

      - name: Upload KupiProdai.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: KupiProdai-Windows-Release
          path: |
            KupiProdai.exe
            ads.txt
